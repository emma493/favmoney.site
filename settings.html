<div class="toast" id="toast" role="status"></div>
<script type="module">
import { auth, onAuthStateChanged, signOut } from './js/firebase.js';
(function(){
  try{onAuthStateChanged(auth,function(u){
    document.getElementById('who').textContent=u?(u.email||'member'):'Signed out';
  });}catch(e){}
  document.getElementById('out').addEventListener('click',async function(){try{await signOut(auth);}catch(e){}location.href='index.html';});
})();
</script>
