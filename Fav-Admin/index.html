  <style>
    :root{--ad-bg:#0F1014;--ad-side:#16171D;--ad-card:#1E1F27;--ad-accent:#01D676;--ad-mute:#A1A2A7}
    body{background:var(--ad-bg)}
    /* shell */
    .ad-shell{display:none;min-height:100vh}
    body.authed .ad-shell{display:flex}
    .ad-side{width:248px;flex:none;min-height:100vh;display:flex;flex-direction:column;padding:20px 16px;background:var(--ad-side);border-right:1px solid rgba(255,255,255,.08)}
    .ad-brand{font-size:19px;font-weight:800;color:#fff;padding:0 8px;margin-bottom:32px}
    .ad-brand em{font-style:normal;color:var(--ad-accent)}
    .ad-nav{display:flex;flex-direction:column;gap:4px}
    .ad-nav a,.ad-nav button{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ad-mute);text-decoration:none;background:none;border:0;font-family:var(--font);cursor:pointer;text-align:left}
    .ad-nav a.on{background:rgba(1,214,118,.12);color:#fff}
    .ad-nav [disabled]{opacity:.45;cursor:not-allowed}
    .ad-nav svg{width:18px;height:18px;flex:none}
    .ad-side .ad-out{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
    .ad-main{flex:1;min-width:0;padding:24px;max-width:960px;width:100%;margin:0 auto;box-sizing:border-box}
    .ad-tabs{display:none}
    .ad-empty{background:var(--ad-card);border:1px dashed rgba(255,255,255,.14);border-radius:18px;padding:56px 24px;text-align:center;margin-top:16px}
    .ad-empty h2{margin:0 0 8px;font-size:22px;color:#fff}
    .ad-empty p{margin:0;color:var(--ad-mute);font-size:14px}
    .ad-top{font-size:22px;font-weight:800;color:#fff;margin:0}
    @media(max-width:900px){
      .ad-side{display:none}
      .ad-tabs{display:flex;align-items:center;gap:6px;padding:12px 16px;background:var(--ad-side);border-bottom:1px solid rgba(255,255,255,.08);overflow-x:auto}
      .ad-tabs span{color:#fff;font-weight:800;margin-right:8px;flex:none}
      .ad-tabs a{flex:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ad-mute);text-decoration:none}
      .ad-tabs a.on{background:rgba(1,214,118,.14);color:#fff}
      .ad-main{padding:16px}
    }
  </style>
  <script src="../js/loader.js"></script>
</head>
