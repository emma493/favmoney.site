</head>
<body>
<header class="topnav" id="topnav"><div class="topnav-inner">
<a class="brand" href="index.html"><span class="brand-word"><span class="g">FAV</span><span class="w">MONEY</span></span></a>
<nav class="nav-links" aria-label="Primary">
<a href="earn.html" class="active">Earn<span class="dot"></span></a>

</nav>
<div class="auth"><a class="user-chip" href="profile.html" id="user-chip"><span class="bal" id="chip-bal">—</span><span id="chip-name">Sign in</span></a><button class="icon-btn" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="ping"></span></button></div>
</div></header>
<main>
<section class="page-hero"><div class="dash-shell">
<h1 class="dash-title">Earn</h1>
<p>Play games, answer surveys, earn cashback. New quests drop daily.</p>
<div class="notice" id="auth-wall" style="display:none">Browsing as guest. <a href="signin.html" style="color:#8ff0bd;font-weight:700">Sign in</a> to start offers and earn.</div>
</div></section>
</main>
<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 Favmoney · favmoney.site</span><span><a href="withdraw.html">Cashout</a> · <a href="terms.html">Terms</a></span></div></div></footer>
<nav class="mobilenav" aria-label="Mobile"><a href="earn.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Earn</a><a href="withdraw.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cashout</a></nav>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import { auth, onAuthStateChanged, getWallet, migrateLocal, wasMigrated, track } from './js/firebase.js';
(function(){
  var uid=null;
  var toast=document.getElementById('toast'),tm=null;
  function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('show');},3000);}
  try{
    onAuthStateChanged(auth,async function(user){
      if(!user){
        uid=null;
        document.getElementById('auth-wall').style.display='';
        document.getElementById('user-chip').setAttribute('href','signin.html');
        return;
      }
      uid=user.uid;
      document.getElementById('auth-wall').style.display='none';
      document.getElementById('user-chip').setAttribute('href','profile.html');
      document.getElementById('chip-name').textContent=(user.email||'Member').split('@')[0];
      try{
        if(!wasMigrated()){await migrateLocal(uid);show('Old browser balance moved to your account.');}
        var w=await getWallet(uid);
        document.getElementById('chip-bal').textContent='$'+Number(w.pending).toFixed(2);
      }catch(err){document.getElementById('chip-bal').textContent='$0.00';}
    });
  }catch(e){document.getElementById('auth-wall').style.display='';}
  document.getElementById('bell').addEventListener('click',function(){
    show('No new notifications.');
  });
  var root=document.documentElement;function onS(){if(scrollY>0)root.setAttribute('data-top-nav-scrolled','true');else root.removeAttribute('data-top-nav-scrolled');}addEventListener('scroll',onS,{passive:true});onS();
})();
</script>
</body>
</html>
