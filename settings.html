<script type="module">
import { auth, onAuthStateChanged, signOut } from './js/firebase.js';
import { mountHeader } from './js/header.js';
import { requireAuth, clearSessionHint } from './js/guard.js';
(function(){
  if(window.FavLoader){FavLoader.hold();}
  // Gated: nothing renders until Firebase confirms the member. Logged-out
  // visitors are redirected to signin — there is no guest state.
  requireAuth().then(async function(u){
    document.getElementById('who').textContent=u.email||'member';
    try{ await mountHeader(u); }catch(e){}
    finally{
      if(window.FavLoader)FavLoader.pageReady();
    }
  });
  document.getElementById('out').addEventListener('click',async function(){try{clearSessionHint();}catch(_){}try{await signOut(auth);}catch(e){}location.href='index.html';});
})();
</script>
