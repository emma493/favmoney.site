<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History · Favmoney</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topnav" style="background:rgba(29,30,48,.9)"><div class="topnav-inner">
<a class="brand" href="index.html"><span class="brand-word"><span class="g">FAV</span><span class="w">MONEY</span></span></a>
<div class="auth"><a class="btn btn-ghost" href="dashboard.html">Dashboard</a><a class="btn btn-green" href="cashout.html">Cashout</a></div>
</div></header>
<main class="section" style="padding-top:130px"><div class="wrap" style="max-width:760px">
<a href="dashboard.html" style="color:#9be9c4;font-size:14px;text-decoration:none">← Back to dashboard</a>
<h1 style="font-size:32px;margin:12px 0 6px">Earnings history</h1>
<p style="color:var(--muted)">Every proof and cashout on your account, newest first.</p>
<h2 style="font-size:20px;margin-top:24px">Quest rewards</h2>
<div id="proofs"></div>
<h2 style="font-size:20px;margin-top:24px">Cashouts</h2>
<div id="outs"></div>
</div></main>
<nav class="mobilenav" aria-label="Mobile"><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</a><a href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Earn</a><a href="cashout.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cashout</a></nav>
<div class="toast" id="toast" role="status"></div>
<script src="js/store.js"></script>
<script type="module">
import { auth, onAuthStateChanged, fetchUserDocs } from './js/firebase.js';
(function(){
  function row(t,s){return '<div class="mile"><span>'+t+' · '+s+'</span></div>';}
  function paintLocal(){
    var p=FavStore.getProofs().slice().reverse();
    document.getElementById('proofs').innerHTML=p.length?p.map(function(x){return row((x.label||'Quest')+' — $'+Number(x.amount||0).toFixed(2),x.status||'pending');}).join(''):'<p style="color:var(--muted)">No quest rewards yet.</p>';
    var c=[];try{c=JSON.parse(localStorage.getItem('favmoney_cashouts')||'[]').slice().reverse();}catch(e){}
    document.getElementById('outs').innerHTML=c.length?c.map(function(x){return row('Cashout '+x.method+' — $'+Number(x.amount||0).toFixed(2),x.status||'review');}).join(''):'<p style="color:var(--muted)">No cashouts yet.</p>';
  }
  try{
    onAuthStateChanged(auth,async function(user){
      if(!user){paintLocal();return;}
      try{
        var p=await fetchUserDocs(user.uid,'proofs',50),c=await fetchUserDocs(user.uid,'cashouts',50);
        document.getElementById('proofs').innerHTML=p.length?p.map(function(x){return row(((x.title||x.label||'Quest')+' — $'+Number(x.amount||0).toFixed(2)),x.status||'pending');}).join(''):'<p style="color:var(--muted)">No quest rewards yet.</p>';
        document.getElementById('outs').innerHTML=c.length?c.map(function(x){return row(('Cashout '+x.method+' — $'+Number(x.amount||0).toFixed(2)),x.status||'review');}).join(''):'<p style="color:var(--muted)">No cashouts yet.</p>';
      }catch(e){paintLocal();}
    });
  }catch(e){paintLocal();}
})();
</script>
</body>
</html>
