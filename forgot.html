<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Favmoney</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topnav" style="background:rgba(29,30,48,.9)"><div class="topnav-inner">
<a class="brand" href="index.html"><span class="brand-word"><span class="g">FAV</span><span class="w">MONEY</span></span></a>
<div class="auth"><a class="btn btn-ghost" href="signin.html">Back</a></div>
</div></header>
<main class="section" style="padding-top:130px"><div class="wrap">
<div class="auth-card">
<h1 style="font-size:28px;margin:0 0 6px">Reset your password</h1>
<p style="color:var(--muted);font-size:14px;margin:0 0 8px">Enter your account email and we will send a reset link.</p>
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
<button class="btn btn-green btn-block" id="go" style="margin-top:16px">Send reset link</button>
<p class="tiny"><a href="signin.html">Back to sign in</a></p>
</div>
</div></main>
<div class="toast" id="toast" role="status"></div>
<script src="js/store.js"></script>
<script type="module">
import { auth, sendPasswordResetEmail, track } from './js/firebase.js';
(function(){
  var toast=document.getElementById('toast'),tm=null;function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('show');},3400);}
  document.getElementById('go').addEventListener('click',async function(){
    var e=document.getElementById('email').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){show('Enter a valid email.');return;}
    try{
      await sendPasswordResetEmail(auth,e);
      track('password_reset',{});
      show('Reset link sent. Check your inbox.');
    }catch(err){
      var msg='Could not send reset link. Try again.';
      if(err&&err.code==='auth/user-not-found')msg='No account for this email. Try Sign Up.';
      if(err&&err.code==='auth/invalid-email')msg='Enter a valid email.';
      show(msg);
    }
  });
})();
</script>
</body>
</html>
