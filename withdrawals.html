<script type="module">
import { auth, onAuthStateChanged, fetchUserDocs, getUnclaimedRewards } from './js/firebase.js';
import { mountHeader } from './js/header.js';
import { formatUSD } from './js/currency.js';
import { requireAuth } from './js/guard.js';
(function(){
  if(window.FavLoader)FavLoader.hold();
  setTimeout(function(){if(document.documentElement.getAttribute('data-auth')==='member'&&window.FavLoader)FavLoader.pageReady();},6000);
  function relDate(ts){
    if(!ts)return 'recently';
    var ms=ts.seconds?ts.seconds*1000:new Date(ts).getTime();
    var d=Math.max(0,Math.round((Date.now()-ms)/864e5));
    if(d===0)return 'today';if(d===1)return '1 day ago';return d+' days ago';
  }
  function pill(s){
    s=(s||'review').toLowerCase();
    if(s==='paid'||s==='approved')return '<span class="pill paid">Paid</span>';
    if(s==='declined')return '<span class="pill declined">Declined</span>';
    return '<span class="pill review">Review</span>';
  }
  function render(list){
    var empty=list.length===0;
    document.getElementById('empty').style.display=empty?'':'none';
    document.getElementById('tbl-wrap').style.display=empty?'none':'';
    document.getElementById('rows').innerHTML=list.map(function(c){
      return '<tr><td data-label="Amount">'+formatUSD(Number(c.amount||0))+'</td><td data-label="Method">'+(c.method||'—')+'</td><td data-label="Status">'+pill(c.status)+'</td><td data-label="Date">'+relDate(c.at)+'</td></tr>';
    }).join('');
  }
  // Gated: nothing renders until Firebase confirms the member. Logged-out
  // visitors are redirected to signin — there is no guest state.
  requireAuth().then(async function(user){
      try{
        await mountHeader(user);
        render(await fetchUserDocs(user.uid,'cashouts',50));
        try{
          var __n=await getUnclaimedRewards(user.uid);
          var __nd=document.getElementById('navdot-rewards');
          if(__nd){if(__n>0){__nd.textContent=__n>9?'9+':__n;__nd.style.display='flex';}else{__nd.style.display='none';}}
        }catch(_){}
      }catch(e){try{render([]);}catch(_){}}
      finally{
        if(window.FavLoader)FavLoader.pageReady();
      }
  });
  // Poll cashout status every 30s so "Review" → "Paid" flips live.

    if(!uid)return;
    try{
      render(await fetchUserDocs(uid,'cashouts',50));
    }catch(_){}
  },30000);

})();
</script>
