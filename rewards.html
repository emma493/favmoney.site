<script type="module">
import { auth, onAuthStateChanged, getWallet } from './js/firebase.js';
if (window.FavLoader) FavLoader.hold();
(function () {
  function ready() { if (window.FavLoader) FavLoader.pageReady(); }
  try {
    onAuthStateChanged(auth, async function (user) {
      if (!user) { document.getElementById('chip-bal').textContent='—'; document.getElementById('chip-name').textContent='Sign in'; document.getElementById('user-chip').setAttribute('href','signin.html'); ready(); return; }
      try {
        var w = await getWallet(user.uid);
        document.getElementById('chip-bal').textContent = '$' + Number(w.pending).toFixed(2);
        document.getElementById('chip-name').textContent = (user.email || 'Member').split('@')[0];
      } catch (e) {}
      ready();
    });
  } catch (e) { ready(); }
  setTimeout(ready, 6000);
})();
</script>
</body>
