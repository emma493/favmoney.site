<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Favmoney</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>#page-loader{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(20,21,35,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}#page-loader.hide{opacity:0;pointer-events:none}.spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#01D676;animation:lspin .8s linear infinite}@keyframes lspin{to{transform:rotate(360deg)}}#loader-retry{display:none;width:48px;height:48px;border-radius:50%;background:#01D676;border:0;cursor:pointer;align-items:center;justify-content:center;color:#0d1a13;padding:0}#loader-retry svg{width:22px;height:22px}#page-loader.slow #loader-retry{display:inline-flex}#page-loader.slow #loader-spin{display:none}</style>
  <script src="js/loader.js"></script>
</head>
<body>
<div id="page-loader" role="status" aria-label="Loading Favmoney"><div class="spinner" id="loader-spin" aria-hidden="true"></div><button id="loader-retry" type="button" aria-label="Retry loading"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button></div><script>window.__favLoaderT0=window.__favLoaderT0||Date.now();(function(){setTimeout(function(){var o=document.getElementById("page-loader");if(o)o.classList.add("slow");},8000);var r=document.getElementById("loader-retry");if(r)r.addEventListener("click",function(){location.reload();});})();</script>
<header class="topnav" style="background:rgba(29,30,48,.9)"><div class="topnav-inner">
<a class="brand" href="index.html"><span class="brand-word"><span class="g">FAV</span><span class="w">MONEY</span></span></a>
<div class="auth"><a class="btn btn-green" href="signup.html">Sign Up</a></div>
</div></header>
<main class="section" style="padding-top:130px"><div class="wrap">
<div class="auth-card">
<h1 style="font-size:28px;margin:0 0 6px">Welcome back</h1>
<p style="color:var(--muted);font-size:14px;margin:0 0 8px">Secured by Firebase Auth. Works offline too.</p>
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
<label for="pass">Password</label>
<input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
<button class="btn btn-green btn-block" id="go" style="margin-top:16px">Sign in</button>
<p class="tiny">No account? <a href="signup.html">Create one free</a>.</p>
<p class="tiny" style="margin-top:10px">Prohibited: multiple accounts, completing offers on another user's account, or any VPN, VPS or emulator software.</p>
</div>
</div></main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import { auth, ensureUserDoc, track, signInWithEmailAndPassword } from './js/firebase.js';
(function(){
  if(window.FavLoader){FavLoader.hold();setTimeout(function(){FavLoader.pageReady();},2500);}
  var toast=document.getElementById('toast'),tm=null;function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('show');},3400);}

  document.getElementById('go').addEventListener('click',function(){var __b=this;if(window.FavLoader){return FavLoader.withButton(__b,function(){return __goWork();});}return __goWork();async function __goWork(){
    var e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)){show('Enter a valid email.');return;}
    if(p.length<1){show('Enter your password.');return;}
    try{
      var cred=await signInWithEmailAndPassword(auth,e,p);
      await ensureUserDoc(cred.user,'email');
      try{track('login',{method:'email'});}catch(_){}
      show('Signed in. Redirecting…');setTimeout(function(){location.href='earn.html';},900);
    }catch(err){
      var msg='Sign-in failed. Check email/password.';
      if(err&&err.code==='auth/invalid-credential')msg='Wrong email or password.';
      if(err&&err.code==='auth/user-not-found')msg='No account for this email. Try Sign Up.';
      show(msg);
    }
  }});
})();
</script>
</body>
</html>
