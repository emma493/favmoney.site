<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Offers · Favmoney</title>
  <meta name="description" content="Your started Favmoney offers: milestones, rewards, lottery entries." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topnav" id="topnav"><div class="topnav-inner">
<a class="brand" href="index.html"><span class="brand-word"><span class="g">FAV</span><span class="w">MONEY</span></span></a>
<nav class="nav-links" aria-label="Primary">
<a href="earn.html">Earn<span class="dot"></span></a>
<a href="my-offers.html" class="active">My Offers<span class="dot"></span></a>
<a href="withdraw.html">Cashout<span class="dot"></span></a>
<a href="rewards.html">Rewards<span class="dot"></span></a>
</nav>
<div class="auth"><a class="user-chip" href="profile.html" id="user-chip"><span class="bal" id="chip-bal">$0.00</span><span id="chip-name">Guest</span></a></div>
</div></header>
<main>
<section class="page-hero"><div class="dash-shell">
<h1 class="dash-title">My Offers</h1>
<p>Offers you started. Finish milestones to unlock each reward.</p>
<div class="swiper" id="swiper"></div>
<div class="offer-hero" id="hero"></div>
<div class="tabs" role="tablist" aria-label="Offer details">
<button class="on" data-tab="rewards" role="tab" aria-selected="true">Rewards</button>
<button data-tab="details" role="tab" aria-selected="false">Details</button>
</div>
<div id="panel-rewards"></div>
<div id="panel-details" style="display:none"></div>
</div></section>
</main>
<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 Favmoney · favmoney.site</span><span><a href="earn.html">Earn</a> · <a href="withdraw.html">Cashout</a> · <a href="terms.html">Terms</a></span></div></div></footer>
<nav class="mobilenav" aria-label="Mobile"><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</a><a href="earn.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Earn</a><a href="withdraw.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cashout</a></nav>
<div class="toast" id="toast" role="status"></div>
<script src="js/store.js"></script>
<script type="module">
import { auth, onAuthStateChanged, getWallet } from './js/firebase.js';
(function(){
  var OFFERS=[
    {id:'merge-quest',title:'Merge Quest',sub:'Puzzle · reach Level 12',pay:18.20,img:'assets/games/game-sunshine-island.webp',os:['Android','iOS'],miles:[['Install and open the game',1.10,'30D'],['Complete tutorial (Level 3)',4.30,'30D'],['Reach Level 12',12.80,'30D']]},
    {id:'royal-riches',title:'Royal Riches',sub:'Match-3 · clear 40 boards',pay:42.50,img:'assets/games/game-royal-match.webp',os:['Android','iOS'],miles:[['Install and finish 5 boards',2.00,'30D'],['Clear 20 boards',14.50,'30D'],['Clear 40 boards',26.00,'30D']]},
    {id:'blade-arena',title:'Blade Arena',sub:'RPG · 20 PvP wins',pay:65.00,img:'assets/games/game-dice-dreams.webp',os:['Android'],miles:[['Install and win 1 battle',3.00,'30D'],['Win 10 PvP battles',22.00,'30D'],['Win 20 PvP battles',40.00,'30D']]},
    {id:'island-builder',title:'Island Builder',sub:'Strategy · unlock 3 islands',pay:12.75,img:'assets/games/game-domino-dreams.webp',os:['Android','iOS'],miles:[['Install and finish tutorial',1.25,'30D'],['Unlock island 2',4.50,'30D'],['Unlock island 3',7.00,'30D']]}
  ];
  var id=(new URLSearchParams(location.search).get('id'))||'merge-quest';
  var cur=OFFERS.filter(function(o){return o.id===id;})[0]||OFFERS[0];
  var toast=document.getElementById('toast'),tm=null;
  function show(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('show');},2800);}
  function render(){
    document.getElementById('swiper').innerHTML=OFFERS.map(function(o){
      return '<button data-id="'+o.id+'" class="'+(o.id===cur.id?'on':'')+'"><img src="'+o.img+'" alt="'+o.title+'" loading="lazy" /><span>'+o.title+'</span></button>';
    }).join('');
    document.getElementById('hero').innerHTML='<img src="'+cur.img+'" alt="'+cur.title+'" />'
      +'<div><h2>'+cur.title+'</h2><p style="color:var(--muted);font-size:13px;margin:0 0 4px">'+cur.sub+'</p>'
      +'<div class="big">$'+cur.pay.toFixed(2)+'</div>'
      +'<div class="os-badges">'+cur.os.map(function(s){return '<span>'+s+'</span>';}).join('')+'<span>Other</span></div>'
      +'<button class="btn btn-green" id="open-offer">Open</button></div>';
    document.getElementById('panel-rewards').innerHTML=
      '<div class="reward-row gold"><span class="amt">$50,000</span><span class="tt">Weekly Lottery<br /><small style="color:var(--faint)">0 tickets</small></span><a class="link-view" href="#" data-lottery>View</a></div>'
      +'<div class="reward-row gold"><span class="amt">$250,000</span><span class="tt">Quarterly Lottery<br /><small style="color:var(--faint)">0 tickets</small></span><a class="link-view" href="#" data-lottery>View</a></div>'
      +'<h3 style="font-size:15px;margin:18px 0 0">Main rewards</h3>'
      +cur.miles.map(function(m){
        return '<div class="reward-row"><span class="amt">$'+m[1].toFixed(2)+'</span><span class="tt">'+m[0]+'</span><span class="due"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg> '+m[2]+'</span></div>';
      }).join('');
    document.getElementById('panel-details').innerHTML='<div class="notice">Complete every milestone inside the partner game or app. Rewards move to pending after partner review, usually within 24 hours. One account per human — VPN farming voids rewards.</div><p style="color:var(--muted);font-size:14px">'+cur.title+': '+cur.sub+'. Full milestone list lives under the Rewards tab.</p>';
    document.getElementById('open-offer').addEventListener('click',function(){
      show('Opening '+cur.title+'… install via this page so tracking works.');
    });
  }
  document.getElementById('swiper').addEventListener('click',function(e){
    var b=e.target.closest('button[data-id]');if(!b)return;
    cur=OFFERS.filter(function(o){return o.id===b.dataset.id;})[0];render();
    history.replaceState(null,'','my-offers.html?id='+cur.id);
  });
  document.querySelector('.tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]');if(!b)return;
    document.querySelectorAll('.tabs button').forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-selected',on);});
    document.getElementById('panel-rewards').style.display=b.dataset.tab==='rewards'?'':'none';
    document.getElementById('panel-details').style.display=b.dataset.tab==='details'?'':'none';
  });
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-lottery]')){e.preventDefault();show('Lottery opens at launch. Finish offers to earn tickets.');}
  });
  function paintChip(){
    var w=FavStore.getWallet(),u=FavStore.getUser();
    document.getElementById('chip-bal').textContent='$'+w.pending.toFixed(2);
    if(u&&u.email)document.getElementById('chip-name').textContent=u.email.split('@')[0];
  }
  try{
    onAuthStateChanged(auth,async function(user){
      if(!user)return;
      try{var w=await getWallet(user.uid);document.getElementById('chip-bal').textContent='$'+Number(w.pending).toFixed(2);}catch(e){}
      var u=FavStore.getUser();if(u&&u.email)document.getElementById('chip-name').textContent=u.email.split('@')[0];
    });
  }catch(e){}
  paintChip();render();
  var root=document.documentElement;function onS(){if(scrollY>0)root.setAttribute('data-top-nav-scrolled','true');else root.removeAttribute('data-top-nav-scrolled');}addEventListener('scroll',onS,{passive:true});onS();
})();
</script>
</body>
</html>
