<body>
<header class="topnav" id="topnav"><div class="topnav-inner">

<main>
<section class="page-hero"><div class="dash-shell" style="max-width:900px">
<h1 class="dash-title">Cashout</h1>
<div class="tabs" role="tablist" aria-label="Cashout sections">
<a class="btn btn-ghost" href="withdraw.html" role="tab" aria-selected="false" style="min-height:44px">Cashout</a>
<button class="on" role="tab" aria-selected="true">My Withdrawals</button>
</div>

<h2>No withdrawals yet</h2>

<a class="btn btn-green" href="withdraw.html" style="padding:13px 28px">Make your first cashout</a>
</div>
<div class="tbl-wrap" id="tbl-wrap" style="display:none"><table class="tbl"><thead><tr><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></section>
</main>
<footer><div class="wrap"><div class="foot-bottom"><span>© 2026 Favmoney · favmoney.site</span><span><a href="withdraw.html">Cashout</a> · <a href="terms.html">Terms</a></span></div></div></footer>
<nav class="mobilenav" aria-label="Mobile"><a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>Home</a><a href="earn.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Earn</a><a href="withdraw.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Cashout</a></nav>
<div class="toast" id="toast" role="status"></div>
<script src="js/store.js"></script>
<script type="module">
import { auth, onAuthStateChanged, getWallet, fetchUserDocs } from './js/firebase.js';
(function(){
  function relDate(iso){
    if(!iso)return 'recently';
    var d=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/864e5));
    if(d===0)return 'today';if(d===1)return '1 day ago';return d+' days ago';
  }
  function pill(s){
    s=(s||'review').toLowerCase();
    if(s==='paid'||s==='approved')return '<span class="pill paid">Paid</span>';
    if(s==='declined')return '<span class="pill declined">Declined</span>';
    return '<span class="pill review">Review</span>';
  }
  function render(list){
    var empty=list.length===0;
    document.getElementById('empty').style.display=empty?'':'none';
    document.getElementById('tbl-wrap').style.display=empty?'none':'';
    document.getElementById('rows').innerHTML=list.map(function(c){
      return '<tr><td>$'+Number(c.amount||0).toFixed(2)+'</td><td>'+(c.method||'—')+'</td><td>'+pill(c.status)+'</td><td>'+relDate(c.at||c.createdAt)+'</td></tr>';
    }).join('');
  }
  function local(){
    try{return JSON.parse(localStorage.getItem('favmoney_cashouts')||'[]').slice().reverse();}catch(e){return [];}
  }
  function paintChip(){
    var w=FavStore.getWallet(),u=FavStore.getUser();
    document.getElementById('chip-bal').textContent='$'+w.pending.toFixed(2);
    if(u&&u.email)document.getElementById('chip-name').textContent=u.email.split('@')[0];
  }
  render(local());
  try{
    onAuthStateChanged(auth,async function(user){
      paintChip();
      if(!user)return;
      try{
        var w=await getWallet(user.uid);
        document.getElementById('chip-bal').textContent='$'+Number(w.pending).toFixed(2);
        var outs=await fetchUserDocs(user.uid,'cashouts',50);
        render(outs.length?outs:local());
      }catch(e){}
      var u=FavStore.getUser();if(u&&u.email)document.getElementById('chip-name').textContent=u.email.split('@')[0];
    });
  }catch(e){}
  paintChip();
  var root=document.documentElement;function onS(){if(scrollY>0)root.setAttribute('data-top-nav-scrolled','true');else root.removeAttribute('data-top-nav-scrolled');}addEventListener('scroll',onS,{passive:true});onS();
})();
</script>
</body>
</html>
